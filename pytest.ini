[pytest]
DJANGO_SETTINGS_MODULE = family_finance.settings
pythonpath = family_finance
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --disable-warnings
    --cov=core
    --cov-report=term-missing
    --maxfail=5

# Переменные окружения для тестов
# ВАЖНО: комментарии только на ОТДЕЛЬНЫХ строках!
env =
    DEBUG=True
    SECRET_KEY=test-secret-key-for-testing
    PYTEST_RUNNING=1
    USE_I18N=False
    USE_L10N=False