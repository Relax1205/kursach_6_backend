[pytest]
DJANGO_SETTINGS_MODULE = family_finance.settings
pythonpath = family_finance
testpaths = tests
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
markers =
    integration: end-to-end application scenarios
addopts =
    --verbose
    --tb=short
    --disable-warnings
    --cov=core
    --cov-report=term-missing
    --maxfail=5
env =
    DEBUG=True
    SECRET_KEY=test-secret-key-for-testing
    PYTEST_RUNNING=1
    USE_I18N=False
    USE_L10N=False
    SECURE_SSL_REDIRECT=False
    SESSION_COOKIE_SECURE=False
    CSRF_COOKIE_SECURE=False
